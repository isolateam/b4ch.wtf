<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>b4ch.wtf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/7cc6719bd5f0310be3150ba33418e72e?family=Comic+Sans+MS" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0e;
    --surface: #121518;
    --text: #eae5dc;
    --muted: #75828a;
    --accent: #00e1ff;
    --border: rgba(0, 174, 255, 0.18);
  }

  @font-face {
    font-family: "Comic Sans MS";
    src: url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.eot");
    src: url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.eot?#iefix")format("embedded-opentype"),
    url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.woff2")format("woff2"),
    url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.woff")format("woff"),
    url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.ttf")format("truetype"),
    url("https://db.onlinewebfonts.com/t/7cc6719bd5f0310be3150ba33418e72e.svg#Comic Sans MS")format("svg");
}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Comic Sans MS', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    line-height: 1.6;
    position: relative;
    overflow: hidden;
  }

  #bg-grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    display: block;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 225, 255, 0.025) 0px,
      rgba(0, 225, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 16px 32px;
    background: rgba(10, 12, 14, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 620px;
    margin: 0 auto;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
  }

  .nav-logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }

  .nav-logo .glyph {
    color: var(--accent);
    text-shadow: 0 0 10px rgba(8, 8, 8, 0.5);
  }

  .nav-links {
    display: flex;
    gap: 10px;
  }

  .nav-item {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 5px 12px;
    border-radius: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .nav-item:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .terminal {
    width: 100%;
    max-width: 620px;
    position: relative;
    z-index: 1;
    margin: 0 auto;
    text-align: center;
  }

  #profile {
    animation: settle 0.4s ease-out;
    text-align: center;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .handle {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-weight: 800;
    font-size: clamp(52px, 12vw, 96px);
    line-height: 0.95;
    color: var(--text);
    letter-spacing: -2px;
    text-align: center;
    text-shadow: 0 0 24px rgba(8, 8, 8, 0.25);
  }

  .handle .glyph {
    color: var(--accent);
    animation: flicker 6s linear infinite;
  }

  @keyframes flicker {
    0%, 92%, 94%, 100% { opacity: 1; }
    93% { opacity: 0.4; }
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
  }

  #uptime {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
  }

  #tiktok {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
    background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(45deg, #87f1ff, #ff004c) border-box;
  }

  #tiktok span {
    background-image: linear-gradient(45deg, #87f1ff, #ff004c);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  #discord {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
    background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(45deg, #6200ff, #3700ff) border-box;
  }

  #discord span {
    background-image: linear-gradient(45deg, #6200ff, #3700ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  #github {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: #1f1f1f;
    display: inline-block;
  }

  #github,
  #github a,
  #github span {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  #github a {
    color: #eae5dc;
    text-decoration: none;
  }

  #github span {
    color: #eae5dc;
    background: none;
    background-image: none;
    background-clip: unset;
    -webkit-background-clip: unset;
  }

  footer {
    margin-top: 15px;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    font-size: 12px;
    color: var(--muted);
  }

  .badge-rail {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 1;
    width: 88px;
  }

  .badge-rail-left { left: 240px; }
  .badge-rail-right { right: 240px; }

  .badge {
    display: block;
    image-rendering: pixelated;
  }

  @media (max-width: 900px) {
    .badge-rail { display: none; }
  }
</style>
</head>
<body>

      <a href="about.html" class="nav-item">about</a>
    </div>
  </div>
</nav>

<div class="badge-rail badge-rail-left">

<div class="badge-rail badge-rail-right">

</body>
</html>
