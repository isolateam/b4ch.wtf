<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>b4ch.wtf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0e;
    --surface: #121518;
    --text: #eae5dc;
    --muted: #75828a;
    --accent: #00e1ff;
    --border: rgba(0, 174, 255, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    line-height: 1.6;
    position: relative;
    overflow: hidden;
  }

  #bg-grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    display: block;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 225, 255, 0.025) 0px,
      rgba(0, 225, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- top nav ---------- */

  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 16px 32px;
    background: rgba(10, 12, 14, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 620px;
    margin: 0 auto;
    font-family: 'JetBrains Mono', monospace;
  }

  .nav-logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }

  .nav-logo .glyph {
    color: var(--accent);
    text-shadow: 0 0 10px rgba(0, 225, 255, 0.5);
  }

  .nav-links {
    display: flex;
    gap: 10px;
  }

  .nav-item {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 5px 12px;
    border-radius: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .nav-item:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .terminal {
    width: 100%;
    max-width: 620px;
    position: relative;
    left:5%;
    z-index: 1;
  }

  #profile {
    animation: settle 0.4s ease-out;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .handle {
    font-family: "Azeret Mono", monospace;
    font-weight: 700;
    font-size: clamp(52px, 12vw, 96px);
    line-height: 0.95;
    color: var(--text);
    letter-spacing: -2px;
    text-shadow: 0 0 24px rgba(0, 225, 255, 0.25);
  }

  .handle .glyph {
    color: var(--accent);
    text-shadow: 0 0 18px rgba(0, 225, 255, 0.65), 0 0 40px rgba(0, 225, 255, 0.3);
    animation: flicker 6s linear infinite;
  }

  /*.glyph {
      font-family: "Dancing Script", cursive;
  }*/

  @keyframes flicker {
    0%, 92%, 94%, 100% { opacity: 1; }
    93% { opacity: 0.4; }
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  #uptime {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
  }

  #tiktok {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
    background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(45deg, #87f1ff, #ff004c) border-box;
  }

  #tiktok span {
    background-image: linear-gradient(45deg, #87f1ff, #ff004c);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  #discord {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
    background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(45deg, #6200ff, #3700ff) border-box;
  }

  #discord span {
    background-image: linear-gradient(45deg, #6200ff, #3700ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  footer {
    margin-top: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  /*  badge rails  */

  .badge-rail {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 1;
  }

  .badge-rail-left { left: 240px; }
  .badge-rail-right { right: 240px; }

  .badge {
    display: block;
    image-rendering: pixelated;
  }

  @media (max-width: 900px) {
    .badge-rail { display: none; }
  }
</style>
</head>
<body>

<canvas id="bg-grid"></canvas>

<nav class="top-nav">
  <div class="nav-container">
    <a href="/" class="nav-logo">b4ch<span class="glyph">.wtf</span></a>
    <div class="nav-links">
      <a href="about.html" class="nav-item">about</a>
    </div>
  </div>
</nav>

<div class="badge-rail badge-rail-left">
  <iframe src="//incr.easrng.net/badge?key=b4chwtf" style="background: url(//incr.easrng.net/bg.gif)" title="increment badge" width="88" height="31" frameborder="0"></iframe>
  <img src="gifs/bestviewedcomp.gif" class="badge">
  <img src="gifs/jonezua.gif" class="badge">
  <img src="gifs/smile.gif" class="badge">
  <img src="gifs/spotify.gif" class="badge">
  <img src="gifs/spacelink.gif" class="badge">
</div>

<div class="terminal">
  <div id="profile">
<iframe src="https://free.timeanddate.com/clock/ial3gbou/n32/fn7/fs18/fc00e1ff/tct/pct/ftb/bls0/brs0/bts0/bbs0/tt0" frameborder="0" width="447" height="27" allowtransparency="true"></iframe>

    <h1 class="handle">bach<span class="glyph">.wtf</span></h1>
    <div class="meta-row">
      <span id="uptime">67 legend</span>
      <span id="tiktok"><span>tiktok: @b4chadoo</span></span>
      <span id="discord"><span>discord: bachadoo</span></span>
    </div>
    <footer>copyright @ <a href="https://b4ch.wtf/">b4ch.wtf</a></footer>
  </div>\
</div>

<div class="badge-rail badge-rail-right">
  <img src="gifs/vscbutton.gif" class="badge">
  <img src="gifs/bestviewedopen.gif" class="badge">
  <img src="gifs/winrar3.gif" class="badge">
  <img src="gifs/umbreon.gif" class="badge">
  <img src="gifs/bach.gif" class="badge">
  <img src="gifs/notepad.gif" class="badge">
</div>

<script src="visuals.js"></script>

</body>
</html>
